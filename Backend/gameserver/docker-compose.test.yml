services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cooking_game_test
      POSTGRES_USER: game_test
      POSTGRES_PASSWORD: game_test_password
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_test -d cooking_game_test"]
      interval: 2s
      timeout: 2s
      retries: 15
