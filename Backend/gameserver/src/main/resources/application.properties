spring.application.name=gameserver
spring.config.import=optional:file:.env[.properties],optional:file:Backend/gameserver/.env[.properties]
app.base-url=${APP_BASE_URL:http://localhost:8080}

# 1. PostgreSQL 연결 설정
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cooking_game}
spring.datasource.username=${DB_USERNAME:game_manager}
spring.datasource.password=${DB_PASSWORD}

# 2. JPA/Hibernate 설정
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# DB 스키마 변경은 Flyway 이력으로 관리
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# 커넥션 마름 현상 방지 설정(서버 과부하를 막기 위해 설정)
spring.jpa.open-in-view=false

# PostgreSQL 방언 설정
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 3. 드라이버 설정
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT 설정: 운영 환경에서는 반드시 충분히 긴 임의 문자열을 주입
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:300000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# 4. 메일 설정 (Naver SMTP)
spring.mail.host=smtp.naver.com
spring.mail.port=465
spring.mail.username=${NAVER_ID}
spring.mail.password=${NAVER_APP_PASSWORD}

# SMTP 상세 설정
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.naver.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
