spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:55432/cooking_game_test}
spring.datasource.username=${TEST_DB_USERNAME:game_test}
spring.datasource.password=${TEST_DB_PASSWORD:game_test_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true

app.base-url=http://localhost:8080
app.jwt.secret=test-only-secret-key-that-is-longer-than-32-characters
app.jwt.access-expiration-ms=60000
app.jwt.refresh-expiration-ms=120000

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.ssl.enable=false
