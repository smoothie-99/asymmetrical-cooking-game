name: Backend CI

on:
  push:
    paths:
      - "Backend/gameserver/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "Backend/gameserver/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/gameserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Test and build
        env:
          JWT_SECRET: ci-only-secret-key-that-is-longer-than-32-characters
        run: ./gradlew clean test bootJar --no-daemon
